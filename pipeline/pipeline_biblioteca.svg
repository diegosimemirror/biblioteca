<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="560" viewBox="0 0 1640 560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pipeline de la biblioteca (estilo n8n)</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Lienzo -->
  <rect width="1640" height="560" fill="#f4f4f6"/>

  <!-- Notas adhesivas -->
  <rect x="40" y="28" width="760" height="150" rx="6" fill="#fff6d9" stroke="#f1dd9b"/>
  <text x="62" y="62" font-size="17" font-weight="700" fill="#3f3f46">Biblioteca ordenada como una biblioteca universitaria</text>
  <text x="62" y="92" font-size="14" fill="#52525b">Cada libro recibe una signatura en el nombre del archivo:</text>
  <text x="62" y="116" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#18181b">Dewey_Apellido_Año_Título.ext   →   193_Vieweg_2020_The-Idealism-of-Freedom.pdf</text>
  <text x="62" y="146" font-size="14" fill="#52525b">Una sola carpeta (sin subcarpetas ni espacios): ordenar por nombre = recorrer el estante, tema → autor.</text>

  <rect x="840" y="28" width="760" height="150" rx="6" fill="#ece9ff" stroke="#cfc7ff"/>
  <text x="862" y="62" font-size="17" font-weight="700" fill="#3f3f46">Primera ejecución · 23/11/2026</text>
  <text x="862" y="92" font-size="14" fill="#52525b">604 archivos · 604 movimientos · 0 errores · mismo tamaño antes y después (5,97 GB)</text>
  <text x="862" y="118" font-size="14" fill="#52525b">569 en la biblioteca (555 libros + 14 audios) · 29 en revisar/ · 6 en _otros/</text>
  <text x="862" y="146" font-size="14" fill="#52525b">B1–B3 solo leen; nada se mueve hasta aprobar el catálogo.</text>

  <!-- Conexiones -->
  <g stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="164" y1="278" x2="254" y2="278"/>
    <line x1="364" y1="278" x2="454" y2="278"/>
    <line x1="564" y1="278" x2="654" y2="278"/>
    <line x1="764" y1="278" x2="854" y2="278"/>
    <line x1="964" y1="278" x2="1054" y2="278"/>
    <line x1="1164" y1="278" x2="1254" y2="278"/>
    <line x1="1364" y1="278" x2="1454" y2="278"/>
  </g>
  <path d="M1566,278 C1618,278 1618,466 1554,466" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#flecha)"/>

  <!-- Nodos -->
  <g filter="url(#sombra)">
    <!-- 1 Inicio (disparador: lado izquierdo redondeado) -->
    <path d="M110,230 H146 Q158,230 158,242 V314 Q158,326 146,326 H110 A48,48 0 0 1 110,230 Z" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="262" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="462" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="662" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="862" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="1062" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/>
    <rect x="1262" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#b9adff" stroke-width="2"/>
    <rect x="1462" y="230" width="96" height="96" rx="12" fill="#fff" stroke="#ff8a7a" stroke-width="2"/>
    <rect x="1482" y="430" width="72" height="72" rx="10" fill="#fff" stroke="#c4c4cc" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>

  <!-- Asas de entrada (rectángulo) y salida (círculo) -->
  <g fill="#9ca3af">
    <circle cx="160" cy="278" r="5"/>
    <rect x="257" y="271" width="5" height="14" rx="1"/><circle cx="360" cy="278" r="5"/>
    <rect x="457" y="271" width="5" height="14" rx="1"/><circle cx="560" cy="278" r="5"/>
    <rect x="657" y="271" width="5" height="14" rx="1"/><circle cx="760" cy="278" r="5"/>
    <rect x="857" y="271" width="5" height="14" rx="1"/><circle cx="960" cy="278" r="5"/>
    <rect x="1057" y="271" width="5" height="14" rx="1"/><circle cx="1160" cy="278" r="5"/>
    <rect x="1257" y="271" width="5" height="14" rx="1"/><circle cx="1360" cy="278" r="5"/>
    <rect x="1457" y="271" width="5" height="14" rx="1"/><circle cx="1560" cy="278" r="5"/>
  </g>

  <!-- Iconos -->
  <path d="M100,258 L128,278 L100,298 Z" fill="#ff6d5a"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#fff">
    <rect x="286" y="258" width="48" height="40" rx="6" fill="#27272a"/><text x="295" y="284">&gt;_</text>
    <rect x="486" y="258" width="48" height="40" rx="6" fill="#27272a"/><text x="495" y="284">&gt;_</text>
    <rect x="886" y="258" width="48" height="40" rx="6" fill="#27272a"/><text x="895" y="284">&gt;_</text>
    <rect x="1486" y="258" width="48" height="40" rx="6" fill="#27272a"/><text x="1495" y="284">&gt;_</text>
  </g>
  <path d="M710,252 C714,272 716,274 736,278 C716,282 714,284 710,304 C706,284 704,282 684,278 C704,274 706,272 710,252 Z" fill="#d97757"/>
  <circle cx="752" cy="236" r="13" fill="#d97757"/><text x="752" y="241" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">×3</text>
  <circle cx="1110" cy="278" r="20" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M1100,279 L1107,286 L1121,270" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1297" y="260" width="9" height="36" rx="2" fill="#7b61ff"/><rect x="1314" y="260" width="9" height="36" rx="2" fill="#7b61ff"/>
  <path d="M1504,466 a14,14 0 1 1 5,11" fill="none" stroke="#71717a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1500,476 L1510,480 L1508,469" fill="none" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Etiquetas -->
  <g font-size="14" font-weight="600" fill="#27272a" text-anchor="middle">
    <text x="110" y="352">Inicio manual</text>
    <text x="310" y="352">B1 · Explorar</text>
    <text x="510" y="352">B2 · Separar y fichar</text>
    <text x="710" y="352">Clasificar Dewey</text>
    <text x="910" y="352">B3 · Catálogo y plan</text>
    <text x="1110" y="352">Control de calidad</text>
    <text x="1310" y="352">Esperar aprobación</text>
    <text x="1510" y="352">B4 · Mover y renombrar</text>
  </g>
  <g font-size="12" fill="#71717a" text-anchor="middle">
    <text x="310" y="372">inventario de 604</text>
    <text x="310" y="388">archivos</text>
    <text x="510" y="372">metadatos, ISBN, hash</text>
    <text x="510" y="388">→ libro / revisar / _otros</text>
    <text x="710" y="372">Claude, 3 bloques</text>
    <text x="710" y="388">en paralelo</text>
    <text x="910" y="372">catálogo Excel + plan</text>
    <text x="910" y="388">(simulación)</text>
    <text x="1110" y="372">nombres repetidos,</text>
    <text x="1110" y="388">coherencia entre bloques</text>
    <text x="1310" y="372">revisar el catálogo</text>
    <text x="1310" y="388">y reanudar</text>
    <text x="1510" y="372">registro de cada</text>
    <text x="1510" y="388">movimiento</text>
  </g>
  <text x="1468" y="460" font-size="14" font-weight="600" fill="#27272a" text-anchor="end">B5 · Deshacer</text>
  <text x="1468" y="478" font-size="12" fill="#71717a" text-anchor="end">usa el registro; solo si se pide</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#52525b">
    <rect x="40" y="468" width="14" height="14" rx="3" fill="#fff" stroke="#c4c4cc" stroke-width="1.5"/><text x="62" y="480">solo lee la biblioteca</text>
    <rect x="220" y="468" width="14" height="14" rx="3" fill="#fff" stroke="#b9adff" stroke-width="2"/><text x="242" y="480">punto de control humano</text>
    <rect x="420" y="468" width="14" height="14" rx="3" fill="#fff" stroke="#ff8a7a" stroke-width="2"/><text x="442" y="480">modifica la biblioteca (mueve y renombra; no borra)</text>
    <text x="40" y="520" fill="#71717a">Importable en n8n: pipeline/pipeline_biblioteca.n8n.json</text>
  </g>
</svg>
